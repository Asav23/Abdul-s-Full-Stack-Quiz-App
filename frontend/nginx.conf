server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://quiz-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRA fingerprints filenames under /static/, so those are safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references the current fingerprinted bundle, so it must never be
    # served stale - otherwise browsers can load an old index.html pointing at a
    # bundle that no longer exists after the next deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
